name: Documentation Issue
description: Report missing, incorrect, or unclear documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Help us improve the AutoBleem documentation! Report issues or suggest improvements.

  - type: dropdown
    id: doc-type
    attributes:
      label: Documentation Type
      description: What kind of documentation issue is this?
      options:
        - Missing documentation
        - Incorrect/outdated information
        - Unclear/confusing explanation
        - Broken links
        - Typo or formatting issue
        - Request for new guide/tutorial
        - Translation issue
        - Other
    validations:
      required: true

  - type: dropdown
    id: doc-location
    attributes:
      label: Documentation Location
      description: Where is the documentation issue?
      options:
        - README.md
        - docs/ directory
        - Code comments
        - Wiki
        - CLAUDE.md
        - Build documentation (docs/building.md)
        - Linting documentation (docs/linting.md)
        - Other (specify below)
    validations:
      required: true

  - type: input
    id: file-path
    attributes:
      label: Specific File or URL
      description: Link or path to the documentation with the issue
      placeholder: "e.g., docs/building.md, https://github.com/..."
    validations:
      required: false

  - type: textarea
    id: issue-description
    attributes:
      label: Issue Description
      description: What's wrong with the documentation?
      placeholder: Describe the problem clearly
    validations:
      required: true

  - type: textarea
    id: current-content
    attributes:
      label: Current Content (if applicable)
      description: Quote the existing documentation that needs fixing
      placeholder: Paste the current text here
      render: markdown
    validations:
      required: false

  - type: textarea
    id: suggested-content
    attributes:
      label: Suggested Improvement
      description: How should the documentation be changed?
      placeholder: Provide corrected or improved text
      render: markdown
    validations:
      required: false

  - type: dropdown
    id: user-impact
    attributes:
      label: User Impact
      description: How does this documentation issue affect users?
      options:
        - Critical - Prevents users from completing tasks
        - High - Causes significant confusion
        - Medium - Minor confusion or inconvenience
        - Low - Cosmetic or minor issue
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information
      placeholder: Add context, screenshots, or related issues here
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please verify the following before submitting
      options:
        - label: I have searched existing documentation issues
          required: true
        - label: I have verified this is not already fixed in the latest version
          required: false
