name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  format-check:
    name: Code Formatting
    runs-on: ubuntu-24.04
    container:
      image: xianpengshen/clang-tools:20
    steps:
      - uses: actions/checkout@v4

      - name: Check C++ formatting
        run: |
          echo "=== Running format check ==="
          find autobleem/code -type f \( -name '*.cpp' -o -name '*.h' \) -exec clang-format --dry-run --Werror {} +
          echo "=== Format check passed ==="

  language-check:
    name: Translation Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate language files
        run: make lang-validate

      - name: Check translation coverage
        run: |
          echo "Checking translation coverage..."
          for lang in autobleem/resources/lang/*.txt; do
            if grep -q "Untranslated: [1-9]" "$lang"; then
              echo "::warning file=$lang::Language file has untranslated strings"
            fi
          done

  build-x86:
    name: Build (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libsqlite3-dev \
            zlib1g-dev

      - name: Build
        run: make sys

      - name: Run tests
        run: |
          cd build_sys
          ctest --output-on-failure

  build-arm:
    name: Build (ARM Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with ARM toolchain
        run: make build

      - name: Extract ARM binaries from Docker image
        run: make extract

      - name: Verify ARM binary
        run: |
          if [ ! -f build_arm/autobleem-gui ]; then
            echo "::error::ARM build failed - binary not found"
            exit 1
          fi
          file build_arm/autobleem-gui | grep -q "ARM" || {
            echo "::error::Binary is not ARM architecture"
            exit 1
          }
          if [ ! -s build_arm/libs.tar.gz ]; then
            echo "::error::libs.tar.gz missing or empty"
            exit 1
          fi
          tar -tzf build_arm/libs.tar.gz >/dev/null || {
            echo "::error::libs.tar.gz is not a valid gzip tarball"
            exit 1
          }
          for lib in libSDL2-2.0.so libSDL2_image-2.0.so libSDL2_mixer-2.0.so libSDL2_ttf-2.0.so; do
            tar -tzf build_arm/libs.tar.gz | grep -q "${lib}" || {
              echo "::error::libs.tar.gz missing ${lib}"
              exit 1
            }
          done

      - name: Upload ARM build artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: build-arm
          path: build_arm/
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [ format-check, language-check, build-x86, build-arm ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download ARM build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-arm
          path: build_arm/

      - name: Assemble release payload
        run: |
          TAG="${GITHUB_REF_NAME}"
          RELEASE_DIR="autobleem-ng-${TAG}"

          # Merge build output (runtime files only) into Autobleem/ subdir.
          # libs.tar.gz is excluded here — it belongs under Autobleem/lib/, not
          # at Autobleem/ top level — and is dropped into the right place below.
          mkdir -p "${RELEASE_DIR}/Autobleem"
          rsync -a \
            --exclude='CMakeCache.txt' \
            --exclude='CMakeFiles/' \
            --exclude='cmake_install.cmake' \
            --exclude='Makefile' \
            --exclude='libsqlite3.a' \
            --exclude='libs.tar.gz' \
            --exclude='autobleem/' \
            build_arm/ "${RELEASE_DIR}/Autobleem/"

          # Merge payload (USB structure: Games/, Apps/, themes/, boot scripts).
          # This brings in the in-tree baseline Autobleem/lib/libs.tar.gz, which
          # we then overwrite with the freshly-built one from the build-arm artifact.
          rsync -a autobleem/payload/ "${RELEASE_DIR}/"
          cp build_arm/libs.tar.gz "${RELEASE_DIR}/Autobleem/lib/libs.tar.gz"

          # Include changelog and readme
          cp CHANGELOG.md README.md "${RELEASE_DIR}/"

          # Zip preserving permissions
          zip -r "${RELEASE_DIR}.zip" "${RELEASE_DIR}/"

          echo "RELEASE_ZIP=${RELEASE_DIR}.zip" >> "$GITHUB_ENV"
          echo "Release archive: $(du -sh ${RELEASE_DIR}.zip | cut -f1)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            --title "AutoBleem-NG ${TAG}" \
            --notes-from-tag \
            "${RELEASE_ZIP}"
